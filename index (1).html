<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اسراء ومحمود</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #e4e5de;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .card {
      position: relative;
      width: 100%;
      max-width: 480px;
      align-self: flex-start;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 8px 30px rgba(60, 70, 30, 0.15);
    }
    .map {
      position: absolute;
      left: 44.4%;
      top: 74.2%;
      width: 13.9%;
      height: 7.8%;
      border-radius: 10px;
    }
    .map:hover { background: rgba(95, 106, 46, 0.08); }
    .map:focus-visible { outline: 2px solid #5f6a2e; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="invitation.jpg" alt="دعوة حفل زفاف اسراء ومحمود، السبت 28.11.2026، الاستقبال 7:00 مساءً">
    <a class="map" href="https://maps.app.goo.gl/uyGbuYCcD46Gv1L1A" target="_blank" rel="noopener" aria-label="موقع الحفل على خرائط جوجل"></a>
  </main>
</body>
</html>
